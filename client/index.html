<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot War</title>
    <meta property="og:title" content="Dot War - Wave-based 2D survival shooter" />
    <meta property="og:description" content="Dot War – Wave-based 2D survival shooter. Play now!" />
    <meta property="og:image" content="https://game.huuvan.dev/favicon.png" />
    <meta property="og:url" content="https://game.huuvan.dev/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dot War - Wave-based 2D survival shooter" />
    <meta name="twitter:description" content="Dot War – Wave-based 2D survival shooter. Play now!" />
    <meta name="twitter:image" content="https://game.huuvan.dev/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect handler — restores path from ?p= query param set by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search) {
          var params = new URLSearchParams(search);
          var p = params.get('p');
          if (p) {
            var q = params.get('q');
            var path =
              p.replace(/~and~/g, '&') +
              (q ? '?' + q.replace(/~and~/g, '&') : '') +
              location.hash;
            history.replaceState(null, null, path);
          }
        }
      })();
    </script>
    <script type="module" src="%BASE%src/main.tsx"></script>
  </body>
</html>
